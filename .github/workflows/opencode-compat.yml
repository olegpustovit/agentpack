name: OpenCode compatibility

on:
  pull_request:
    paths:
      - 'internal/harness/opencode/**'
      - 'internal/harness/cursor/**'
      - 'internal/hooks/**'
      - 'internal/paths/**'
      - 'internal/staging/**'
      - 'internal/sync/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/opencode-compat.yml'
  push:
    branches: [dev, main]
    paths:
      - 'internal/harness/opencode/**'
      - 'internal/harness/cursor/**'
      - 'internal/hooks/**'
      - 'internal/paths/**'
      - 'internal/staging/**'
      - 'internal/sync/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/opencode-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: OpenCode ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, version: 1.17.11, major: 1, asset: opencode-linux-x64.tar.gz, sha256: 6aefcbbb7f04cdb4642be5208ddbfabb3c3d274f816bf42bff72eea5c244dca2}
          - {os: ubuntu-latest, version: 1.19.5, major: 1, asset: opencode-linux-x64.tar.gz, sha256: 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a}
          - {os: ubuntu-latest, version: 2.2.2, major: 2, asset: opencode-linux-x64.tar.gz, sha256: 3a38b8c284450a5ca81a2c1ebbf29ebe05e618518f095da0066652167eb0eb33}
          - {os: macos-14, version: 1.17.11, major: 1, asset: opencode-darwin-x64.zip, sha256: 7f3e517bb9c7e671e8d311feecf890ccb336a20a0653fb8953b6a117c9750701}
          - {os: macos-14, version: 1.19.5, major: 1, asset: opencode-darwin-x64.zip, sha256: b0212efa6db347187225a17fa3a31c6b261bf4c9f1589a290b0ca902d720d250}
          - {os: macos-14, version: 2.2.2, major: 2, asset: opencode-darwin-x64.zip, sha256: 898677aa3c686326a37eda1e5875a45c6d1510717ac663236aa200e913b13cff}
          - {os: windows-latest, version: 1.17.11, major: 1, asset: opencode-windows-x64.zip, sha256: 131dda928e33782d1ad3365ecce6e39c1edf9cf7abe3d48649d5b0d157ee0107}
          - {os: windows-latest, version: 1.19.5, major: 1, asset: opencode-windows-x64.zip, sha256: 09a6e693157f0887e504f2cf4357a8cbddc5ead5d0dffb9a269dcc47c48640f5}
          - {os: windows-latest, version: 2.2.2, major: 2, asset: opencode-windows-x64.zip, sha256: e604e66cc13128fe36db7c68c7b0ed31c10b2ce759dd3d702eae080dc140bed5}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Download verified OpenCode release
        shell: pwsh
        env:
          OC_VERSION: ${{ matrix.version }}
          OC_MAJOR: ${{ matrix.major }}
          OC_ASSET: ${{ matrix.asset }}
          OC_SHA256: ${{ matrix.sha256 }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'opencode-native'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $archive = Join-Path $directory $env:OC_ASSET
          Invoke-WebRequest "https://github.com/anomalyco/opencode/releases/download/v$env:OC_VERSION/$env:OC_ASSET" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:OC_SHA256) { throw 'OpenCode release checksum mismatch' }
          if ($env:OC_ASSET.EndsWith('.zip')) { Expand-Archive $archive $directory -Force }
          else { tar -xzf $archive -C $directory; if ($LASTEXITCODE -ne 0) { throw 'Could not extract OpenCode' } }
          $name = if ($IsWindows) { 'opencode.exe' } else { 'opencode' }
          $binary = Join-Path $directory $name
          if (-not (Test-Path $binary)) { throw 'OpenCode executable not found' }
          if (-not $IsWindows) { chmod +x $binary }
          "AGENTPACK_TEST_OPENCODE_V$($env:OC_MAJOR)=$binary" >> $env:GITHUB_ENV
      - name: Test native config, plugins, hook bridge and Art login sharing
        run: go test ./internal/harness/opencode ./internal/harness/cursor -run 'TestNative|TestV2Bridge|TestMergeV2InlineSkills|TestFakeHomeSharesArtLogin|TestShareArtLogin' -count=1
